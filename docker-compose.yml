version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: fitness
      POSTGRES_PASSWORD: fitness
      POSTGRES_DB: fitness
    ports: ["5432:5432"]
    volumes: [fitness_pg:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  fitness_pg:
