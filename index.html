  the markup, copy, tokens and behaviour of the corresponding source file, with

  step — this file is a copy, not a redesign.

/** Calories implied by a plan's own macro numbers: 4/4/9 kcal per gram. */
function macroCalories(proteinGrams, carbsGrams, fatGrams) {
  return proteinGrams * 4 + carbsGrams * 4 + fatGrams * 9;
}

 * calories land within 10% of the stated target. The demo refuses to write
 * numbers that do not hold — the same guard the seed applies.

function resolvePlan(plan) {
  const proteinGrams = plan.meals.reduce((total, meal) => total + meal.proteinGrams, 0);
  const carbsGrams = plan.meals.reduce((total, meal) => total + Math.round(meal.calories * 0.45) / 4, 0);
  const fatGrams = plan.meals.reduce((total, meal) => total + Math.round(meal.calories * 0.25) / 9, 0);

  const derived = macroCalories(proteinGrams, carbsGrams, fatGrams);
  const drift = Math.abs(derived - plan.caloriesTarget) / plan.caloriesTarget;
  if (drift > 0.1) {
    throw new Error(
      'Plan "' + plan.slug + '" macros imply ' + Math.round(derived) + ' kcal against a target of ' +
      plan.caloriesTarget + ' (' + (drift * 100).toFixed(1) + '% drift, limit 10%).',
    );
  }

  return Object.assign({}, plan, {
    proteinGrams: Math.round(proteinGrams),
    carbsGrams: Math.round(carbsGrams),
    fatGrams: Math.round(fatGrams),
  });
}

  return free[0];
})();

/* ==========================================================================
   Store — localStorage stands in for the API. Keyed by user so two accounts in
   one browser do not see each other's logs.
   ========================================================================== */
const KEY = 'apex.demo.v1';

function defaultState() {
  return {
    users: {},
    session: null,
    // The real price label is server-owned (NEXT_PUBLIC_PREMIUM_PRICE_LABEL via
    // /api/billing/plan). Here it is what that endpoint would return when no
    // label is configured, plus the simulated flag the checkout page reads.
    billing: { priceLabel: null, simulated: true },
  };
}

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return defaultState();
    return Object.assign(defaultState(), JSON.parse(raw));
  } catch {
    return defaultState();
  }
}

let state = load();

function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
  } catch {
    pushToast('Could not save — browser storage is full or blocked.', 'error');
  }
}

function currentUser() {
  return state.session ? state.users[state.session] : null;
}

function isPremium() {
  const user = currentUser();
  return !!user && user.subscriptionTier === 'premium';
}

function emptyUserData() {
  return { workoutLogs: [], sets: [], weightSeries: [], coachMessages: [] };
}

function userData() {
  const user = currentUser();
  if (!user) return emptyUserData();
  return Object.assign(emptyUserData(), user.data);
}

function updateUserData(mutator) {
  const user = currentUser();
  if (!user) return;
  user.data = Object.assign({}, user.data, mutator(user.data));
  save();
}

function workoutBySlug(slug) {
  return WORKOUTS.find((workout) => workout.slug === slug) || null;
}

function logCountFor(slug) {
  return userData().workoutLogs.filter((log) => log.slug === slug).length;
}

function embedUrl(workout) {
  return 'https://www.youtube-nocookie.com/embed/' + workout.videoId;
}

function thumbnailFor(workout) {
  return 'https://i.ytimg.com/vi/' + workout.videoId + '/hqdefault.jpg';
}

/* ==========================================================================
   Toast — components/ui/Toast.tsx. Stacked, aria-live polite, 4000ms.
   ========================================================================== */
const AUTO_DISMISS_MS = 4000;
// Two toasts raised in the same tick must not share a DOM key.
let nextToastId = 1;

function pushToast(message, tone) {
  const region = document.getElementById('toast-region');
  const el = document.createElement('div');
  el.className = 'toast toast-' + (tone || 'success');
  el.id = 'toast-' + nextToastId++;
  el.setAttribute('role', 'status');
  el.textContent = message;
  region.appendChild(el);
  setTimeout(() => el.remove(), AUTO_DISMISS_MS);
}

/* ==========================================================================
   Helpers
   ========================================================================== */
function escapeHtml(value) {
  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function capitalize(value) {
  return value ? value.charAt(0).toUpperCase() + value.slice(1) : value;
}

/** pages/dashboard.tsx formatWeek: a YYYY-MM-DD key as "Mon D". */
function formatWeek(key) {
  const parts = String(key).split('-').map(Number);
  const date = new Date(Date.UTC(parts[0], parts[1] - 1, parts[2]));
  return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}

function weekKeyOf(iso) {
  const date = new Date(iso);
  const day = (date.getUTCDay() + 6) % 7;
  date.setUTCDate(date.getUTCDate() - day);
  return date.toISOString().slice(0, 10);
}

/** Buckets logged sets by week, newest first — the shape the progress API returns. */
function volumeSeries() {
  const buckets = new Map();
  userData().sets.forEach(function (set) {
    if (set.weightKg <= 0) return;
    const key = weekKeyOf(set.loggedAt);
    const bucket = buckets.get(key) || { week: key, totalKg: 0, setCount: 0 };
    bucket.totalKg += set.reps * set.weightKg;
    bucket.setCount += 1;
    buckets.set(key, bucket);
  });
  return Array.from(buckets.values()).sort(function (a, b) { return a.week < b.week ? 1 : -1; });
}

function weightSeries() {
  return userData().weightSeries.slice().sort(function (a, b) {
    return a.date < b.date ? -1 : 1;
  });
}

function statCards(workoutCount, weeklyWorkoutCount, latestWeight) {
  return (
    '<section class="grid gap-6 sm-grid-cols-3">' +
      '<div class="card"><h2 class="card-title">Workouts logged</h2><p class="card-body font-display t-section text-white">' + workoutCount + '</p></div>' +
      '<div class="card"><h2 class="card-title">This week</h2><p class="card-body font-display t-section text-white">' + weeklyWorkoutCount + '</p></div>' +
      '<div class="card"><h2 class="card-title">Latest weight</h2><p class="card-body font-display t-section text-white">' +
        (latestWeight == null ? 'Not recorded' : latestWeight + ' kg') + '</p></div>' +
    '</section>'
  );
}

function weightTrendBlock(series, withAxis) {
  const weights = series.map(function (point) { return point.weightKg; });
  const min = Math.min.apply(null, weights);
  const max = Math.max.apply(null, weights);
  const range = max - min || 1;
  return (
    '<div class="weight-chart">' +
      '<div class="weight-bars">' +
        series.map(function (point) {
          return (
            '<div style="height:' + (((point.weightKg - min) / range) * 120 + 20) + 'px" ' +
              'title="' + point.date + ': ' + point.weightKg + ' kg"></div>'
          );
        }).join('') +
      '</div>' +
      (withAxis
        ? '<div class="weight-axis"><span>' + series.slice(0, 5).map(function (p) { return escapeHtml(p.date); }).join('</span><span>') + '</span><span>' + escapeHtml(series[series.length - 1].date) + '</span></div>'
        : '') +
    '</div>'
  );
}

function dashboardView() {
  const data = userData();
  const series = weightSeries();
  const latestWeight = series.length ? series[series.length - 1].weightKg : null;
  const volume = volumeSeries();

  let body = statCards(data.workoutLogs.length, weeklyLogCount(), latestWeight);

  if (isPremium() && volume.length > 0) {
    body +=
      '<section>' +
        '<h2 class="section-title">Weekly volume</h2>' +
        '<div class="grid gap-4 sm-grid-cols-2 lg-grid-cols-3">' +
          volume.map(function (week) {
            return (
              '<div class="card"><h3 class="card-title">' + escapeHtml(formatWeek(week.week)) + '</h3>' +
                '<p class="card-body">' + Math.round(week.totalKg) + ' kg across ' + week.setCount + ' sets</p></div>'
            );
          }).join('') +
        '</div>' +
      '</section>';
  }

  if (series.length > 1) {
    body +=
      '<section>' +
        '<h2 class="section-title">Weight trend</h2>' +
        weightTrendBlock(series, true) +
      '</section>';
  }

  body +=
    '<div class="flex flex-wrap gap-3">' +
      '<a class="focus-ring rounded-md" href="#/workouts"><span class="btn btn-md btn-primary">Browse workouts</span></a>' +
      '<a class="focus-ring rounded-md" href="#/progress"><span class="btn btn-md btn-secondary">Full analytics</span></a>' +
    '</div>';

  return body;
}

function weeklyLogCount() {
  const thisWeek = weekKeyOf(new Date().toISOString());
  return userData().workoutLogs.filter(function (log) {
    return weekKeyOf(log.loggedAt) === thisWeek;
  }).length;
}

const SESSION_GOAL = 10;

function sessionProgress(logCount) {
  if (logCount === 0) {
    return '<p class="mt-4 t-caption text-slate-400">Not started yet</p>';
  }
  const percent = Math.min(100, Math.round((logCount / SESSION_GOAL) * 100));
  const complete = logCount >= SESSION_GOAL;
  return (
    '<div class="mt-4">' +
      '<div class="flex items-center justify-between t-caption">' +
        '<span class="' + (complete ? 'text-emerald-500' : 'text-gold-400') + '">' +
          (complete ? 'Goal reached' : percent + '% of goal') + '</span>' +
        '<span class="text-slate-400">' + logCount + ' session' + (logCount === 1 ? '' : 's') + '</span>' +
      '</div>' +
      '<div class="mt-2 h-1.5 w-full overflow-hidden rounded-full bg-navy-950" aria-hidden="true">' +
        '<div class="h-1.5 rounded-full ' + (complete ? 'w-full bg-emerald-600' : 'bg-gold-600') + '" style="width:' + percent + '%"></div>' +
      '</div>' +
    '</div>'
  );
}

/** The API omits volumeSeries for free users and sends it (possibly empty) for
    premium ones, so the key's presence — not its length — is what tells us
    whether the feature is unlocked. Testing the length would upsell a paying
    user who simply has no sets logged yet. */
function latestLoggedWeight() {
  const series = weightSeries();
  return series.length ? series[series.length - 1].weightKg : null;
}

function progressPayload() {
  const base = {
    workoutCount: userData().workoutLogs.length,
    weeklyWorkoutCount: weeklyLogCount(),
    latestWeight: latestLoggedWeight(),
  };
  // The API only sends `volumeSeries` to premium accounts, and the page gates
  // the volume chart on the key being present — not on a separate entitlement
  // check. Reproduce that shape rather than branching on tier here.
  if (!isPremium()) return base;
  return Object.assign({}, base, { volumeSeries: volumeSeries() });
}

function progressView() {
  const data = progressPayload();

/** With no ANTHROPIC_API_KEY the real API answers from a script over the user's
    own logged data and flags the reply as degraded. Same behaviour here, and
    same disclosure to the user. */
const COACH_RULES = [
  { test: /volume|kg|load|weight.*lift/i, reply: 'Your weekly volume is ' + (volumeSeries()[0] ? Math.round(volumeSeries()[0].totalKg) + ' kg across ' + volumeSeries()[0].setCount + ' sets in the most recent logged week' : 'not logged yet') + '. Progress comes from adding load or reps over time, so keep the same movements and progress them before you add new ones.' },
  { test: /protein|calorie|macro|diet|nutrition|eat/i, reply: 'Your free plan includes the Lean Cut plan: ' + DIET_PLANS[0].caloriesTarget + ' kcal with ' + DIET_PLANS[0].proteinGrams + ' g protein, ' + DIET_PLANS[0].carbsGrams + ' g carbs and ' + DIET_PLANS[0].fatGrams + ' g fat, itemised from breakfast through dinner. Premium adds the maintenance and bulk plans.' },
  { test: /hurt|pain|injury|injur|sore/i, reply: 'I can only give general fitness guidance, not medical advice. Persistent or sharp pain is worth raising with a qualified professional before you train through it.' },
  { test: /rest|recover|day off/i, reply: 'Most programmes get better with a rest day between sessions. If your last week was four or more sessions, take one and let the adaptations land.' },
  { test: /how many|how often|times a week|sessions/i, reply: 'You have logged ' + userData().workoutLogs.length + ' session' + (userData().workoutLogs.length === 1 ? '' : 's') + ', ' + weeklyLogCount() + ' of them this week. Three to four per week is a reasonable target for consistency.' },
  { test: /beginner|start|new to/i, reply: 'Start with the Beginner Full-Body Strength session. It runs 15 minutes, needs no equipment, and teaches the movement patterns before you add load.' },
  { test: /mobility|stretch|flexib/i, reply: 'The mobility library runs from Full-Body Stretching Flow at 30 minutes down to an eight-minute hip routine. Ideal between heavier training days.' },
  { test: /coach|you|who|your/i, reply: 'I read your logged sessions, weekly volume and weight trend, and I keep the last ten turns of this conversation in view.' },
];

function coachReply(prompt) {
  const rule = COACH_RULES.filter(function (entry) { return entry.test.test(prompt); })[0];
  return rule ? rule.reply : 'Without a language model reachable I can only answer common questions: volume, nutrition, recovery, session frequency and where to start. Set ANTHROPIC_API_KEY and restart the server for full answers.';
}

const PRIVATE_VIEWS = {
  '/dashboard': dashboardView,
  '/workouts': workoutsView,
  '/diet': dietView,
  '/progress': progressView,
  '/coach': coachView,
  '/settings': settingsView,
  '/checkout': checkoutView,
};

function render() {
  const app = document.getElementById('app');
  const route = currentRoute();
  document.title = ROUTE_TITLES[route] || 'Apex Fitness';

  if (PUBLIC_ROUTES.indexOf(route) !== -1) {
    app.innerHTML = route === '/' ? landingView() : authView(route);
  } else if (!currentUser()) {
    app.innerHTML = landingView();
  } else {
    const user = currentUser();
    // Sync the filter bar to the URL the way the source's router.query does, so
    // a filtered view is linkable and the back button works.
    if (route === '/workouts') {
      const query = currentQuery();
      ui.workoutFilter = {
        category: query.get('category') || '',
        difficulty: query.get('difficulty') || '',
        q: query.get('q') || '',
      };
    }
    if (route === '/diet') {
      ui.dietFilter = currentQuery().get('goal') || '';
    }

    const body = currentRoute() === '/workouts' && currentPath().split('/').filter(Boolean).length === 2
      ? workoutDetailView(currentSlug())
      : (PRIVATE_VIEWS[route] || dashboardView)();

    app.innerHTML =
      '<div class="shell">' +
        '<a class="skip-link focus-ring" href="#main-content">Skip to main content</a>' +
        sidebar() +
        '<main class="main" id="main-content">' +
          '<h1 class="shell-h1">Welcome back, ' + escapeHtml(user.name) + '</h1>' +
          body +
        '</main>' +
        bottomNav() +
      '</div>';
  }

  wire();
}

/* ==========================================================================
   Wiring. Views are string-built, so listeners can only be attached after the
   markup is in the DOM. `render` calls `wire()` itself rather than being
   wrapped: the wrapper form silently stops working, because this listener
   captures the original function reference and a reassigned `render` never
   reaches it.
   ========================================================================== */
function wire() {
  document.querySelectorAll('[data-action="logout"]').forEach(function (button) {
    button.addEventListener('click', function () {
      state.session = null;
      save();
      navigate('/');
      render();
    });
  });

  const moreButton = document.querySelector('[data-action="open-more"]');
  if (moreButton) {
    moreButton.addEventListener('click', function () {
      moreButton.setAttribute('aria-expanded', 'true');
      document.body.insertAdjacentHTML('beforeend', moreSheet());
      const closeButton = document.querySelector('.modal-panel [data-action="close-more"]');
      if (closeButton) closeButton.focus();
      wireMoreSheet();
    });
  }

  document.querySelectorAll('[data-action="hero-tab"]').forEach(function (button) {
    button.addEventListener('click', function () { selectHeroTab(button.dataset.tab, false); });
    button.addEventListener('keydown', function (event) { heroTabKeydown(event, button.dataset.tab); });
  });

  const authForm = document.getElementById('auth-form');
  if (authForm) {
    authForm.addEventListener('submit', function (event) { handleAuth(event, authForm); });
  }

  const categoryFilter = document.querySelector('[data-action="filter-category"]');
  if (categoryFilter) {
    categoryFilter.addEventListener('change', function () {
      ui.workoutFilter.category = categoryFilter.value;
      navigate('/workouts', queryFromFilter());
    });
  }

  const difficultyFilter = document.querySelector('[data-action="filter-difficulty"]');
  if (difficultyFilter) {
    difficultyFilter.addEventListener('change', function () {
      ui.workoutFilter.difficulty = difficultyFilter.value;
      navigate('/workouts', queryFromFilter());
    });
  }

  const searchInput = document.querySelector('[data-action="filter-q"]');
  if (searchInput) {
    // Re-render on input, then restore the caret: a full innerHTML swap
    // otherwise drops focus mid-word.
    searchInput.addEventListener('input', function () {
      const caret = searchInput.selectionStart;
      ui.workoutFilter.q = searchInput.value;
      navigate('/workouts', queryFromFilter());
      render();
      const next = document.querySelector('[data-action="filter-q"]');
      if (next) {
        next.focus();
        next.setSelectionRange(caret, caret);
      }
    });
  }

  document.querySelectorAll('[data-action="diet-filter"]').forEach(function (button) {
    button.addEventListener('click', function () {
      const goal = button.dataset.goal;
      ui.activePlanId = '';
      if (goal === 'all') {
        ui.dietFilter = '';
        navigate('/diet');
      } else {
        ui.dietFilter = goal;
        navigate('/diet', { goal: goal });
      }
    });
  });

  document.querySelectorAll('[data-action="view-plan"]').forEach(function (button) {
    button.addEventListener('click', function () {
      ui.activePlanId = button.dataset.slug;
      render();
    });
  });

  const logForm = document.getElementById('log-workout-form');
  if (logForm) logForm.addEventListener('submit', handleLogWorkout);

  document.querySelectorAll('[data-action="preset"]').forEach(function (button) {
    button.addEventListener('click', function () {
      addSetRow(button.dataset.name, Number(button.dataset.reps));
    });
  });

  const saveSets = document.querySelector('[data-action="save-sets"]');
  if (saveSets) saveSets.addEventListener('click', handleSaveSets);

  const coachForm = document.getElementById('coach-form');
  if (coachForm) {
    coachForm.addEventListener('submit', function (event) { handleCoach(event, coachForm); });
    coachForm.querySelector('input').addEventListener('keydown', function (event) {
      if (event.key === 'Enter') {
        event.preventDefault();
        coachForm.requestSubmit();
      }
    });
  }

  const subscribe = document.querySelector('[data-action="subscribe"]');
  if (subscribe) {
    subscribe.addEventListener('click', function () {
      const user = currentUser();
      if (!user) return;
      user.subscriptionTier = 'premium';
      save();
      navigate('/settings', { checkout: 'success', simulated: '1' });
    });
  }
}

function queryFromFilter() {
  const query = {};
  if (ui.workoutFilter.category) query.category = ui.workoutFilter.category;
  if (ui.workoutFilter.difficulty) query.difficulty = ui.workoutFilter.difficulty;
  if (ui.workoutFilter.q) query.q = ui.workoutFilter.q;
  return query;
}

function wireMoreSheet() {
  document.querySelectorAll('[data-action="close-more"]').forEach(function (el) {
    el.addEventListener('click', closeMoreSheet);
  });
  document.addEventListener('keydown', function onEscape(event) {
    if (event.key === 'Escape') {
      closeMoreSheet();
      document.removeEventListener('keydown', onEscape);
    }
  });
}

function closeMoreSheet() {
  const sheet = document.querySelector('.overlay-scrim');
  if (sheet) sheet.remove();
  const moreButton = document.querySelector('[data-action="open-more"]');
  if (moreButton) {
    moreButton.setAttribute('aria-expanded', 'false');
    moreButton.focus();
  }
}

/* HeroSessionPicker keyboard handling: arrow keys move between tabs and wrap,
   Home and End jump to the ends. */
function heroTabKeydown(event, id) {
  const index = HERO_PANES.findIndex(function (pane) { return pane.id === id; });
  let next = null;
  if (event.key === 'ArrowRight') next = HERO_PANES[(index + 1) % HERO_PANES.length];
  else if (event.key === 'ArrowLeft') next = HERO_PANES[(index - 1 + HERO_PANES.length) % HERO_PANES.length];
  else if (event.key === 'Home') next = HERO_PANES[0];
  else if (event.key === 'End') next = HERO_PANES[HERO_PANES.length - 1];
  if (!next) return;
  event.preventDefault();
  selectHeroTab(next.id, true);
}

function selectHeroTab(id, focus) {
  ui.heroTab = id;
  HERO_PANES.forEach(function (pane) {
    const tab = document.getElementById('hero-tab-' + pane.id);
    const panel = document.getElementById('hero-panel-' + pane.id);
    const active = pane.id === id;
    if (tab) {
      tab.setAttribute('aria-selected', String(active));
      tab.setAttribute('tabindex', active ? '0' : '-1');
    }
    if (panel) {
      if (active) panel.removeAttribute('hidden');
      else panel.setAttribute('hidden', '');
    }
  });
  if (focus) {
    const tab = document.getElementById('hero-tab-' + id);
    if (tab) tab.focus();
  }
}

/* ==========================================================================
   Actions
   ========================================================================== */
function sleep(ms) {
  return new Promise(function (resolve) { setTimeout(resolve, ms); });
}

function authError(message) {
  const el = document.getElementById('auth-error');
  if (!el) return;
  if (!message) {
    el.hidden = true;
    el.textContent = '';
    return;
  }
  el.hidden = false;
  el.textContent = message;
}

/**
 * Stands in for /api/auth/login and /api/auth/signup.
 *
 * The demo keeps no password hash: there is no server here, and the file is
 * served from GitHub Pages, so a hash would be theatre. Any password of the
 * right length is accepted, and a wrong email is the only way to fail a login.
 */
async function handleAuth(event, form) {
  event.preventDefault();
  const button = form.querySelector('[data-action="auth-submit"]');
  const mode = button.dataset.mode;
  const data = Object.fromEntries(new FormData(form).entries());

  authError('');
  button.disabled = true;
  button.textContent = 'Just a moment…';
  await sleep(400);
  button.disabled = false;
  button.textContent = AUTH_COPY[mode].submitLabel;

  const email = String(data.email || '').trim();
  const password = String(data.password || '');

  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    authError('Enter a valid email address.');
    return;
  }
  if (password.length < MIN_PASSWORD_LENGTH) {
    authError('Password must be at least ' + MIN_PASSWORD_LENGTH + ' characters.');
    return;
  }

  if (mode === '/signup') {
    if (state.users[email]) {
      authError('An account with that email already exists. Sign in instead.');
      return;
    }
    const name = String(data.name || '').trim() || email.split('@')[0];
    state.users[email] = {
      name: name,
      subscriptionTier: 'free',
      createdAt: new Date().toISOString(),
      data: emptyUserData(),
    };
    state.session = email;
  } else {
    const user = state.users[email];
    if (!user) {
      authError('No account with that email. Create a free account to get started.');
      return;
    }
    state.session = email;
  }

  save();
  navigate('/dashboard');
}

function currentSlug() {
  const path = location.hash.replace(/^#/, '').split('?')[0];
  return path.split('/').filter(Boolean)[1] || '';
}

function handleLogWorkout(event) {
  event.preventDefault();
  const form = event.currentTarget;
  const message = document.getElementById('log-workout-message');
  const data = Object.fromEntries(new FormData(form).entries());
  const duration = Number(data.durationMin);

  if (!Number.isFinite(duration) || duration < 1 || duration > 600) {
    message.hidden = false;
    message.className = 'mt-3 t-caption error-text';
    message.textContent = 'Enter a duration between 1 and 600 minutes.';
    return;
  }

  const loggedAt = new Date().toISOString();
  updateUserData(function (data_) {
    return {
      workoutLogs: data_.workoutLogs.concat([{
        slug: currentSlug(),
        loggedAt: loggedAt,
        durationMin: duration,
        notes: String(data.notes || ''),
      }]),
    };
  });

  message.hidden = false;
  message.className = 'mt-3 t-caption text-emerald-500';
  message.textContent = 'Session logged.';
  pushToast('Session logged.', 'success');
  form.reset();
}

function addSetRow(name, reps) {
  const container = document.getElementById('set-rows');
  if (!container) return;
  const placeholder = container.querySelector('p');
  if (placeholder) placeholder.remove();

  const row = document.createElement('div');
  row.className = 'flex items-end gap-2';
  row.setAttribute('data-set-name', name);
  row.innerHTML =
    '<span class="w-12 t-caption text-slate-400">' + escapeHtml(name.slice(0, 10)) + '</span>' +
    '<input class="set-input focus-ring" type="number" min="0" max="200" value="' + reps + '" aria-label="Reps for ' + escapeHtml(name) + '">' +
    '<input class="set-input focus-ring w-20" type="number" min="0" max="1000" step="0.5" value="0" aria-label="Weight in kilograms for ' + escapeHtml(name) + '">';
  container.appendChild(row);

  const saveButton = document.querySelector('[data-action="save-sets"]');
  if (saveButton) saveButton.hidden = false;
}

function handleSaveSets() {
  const error = document.getElementById('set-error');
  const rows = Array.from(document.querySelectorAll('#set-rows [data-set-name]'));
  const loggedAt = new Date().toISOString();
  const slug = currentSlug();
  const entries = [];

  rows.forEach(function (row) {
    const inputs = row.querySelectorAll('input');
    const reps = Number(inputs[0].value);
    const weightKg = Number(inputs[1].value);
    if (!Number.isFinite(reps) || reps < 0) {
      error.hidden = false;
      error.textContent = 'Reps must be zero or more.';
      return;
    }
    if (!Number.isFinite(weightKg) || weightKg < 0) {
      error.hidden = false;
      error.textContent = 'Weight must be zero or more.';
      return;
    }
    entries.push({ slug: slug, exerciseName: row.dataset.setName, reps: reps, weightKg: weightKg, loggedAt: loggedAt });
  });

  if (error.textContent) return;
  if (entries.length === 0) return;

  updateUserData(function (data) {
    return { sets: data.sets.concat(entries) };
  });

  error.hidden = true;
  pushToast('Sets saved.', 'success');
  render();
}

async function handleCoach(event, form) {
  event.preventDefault();
  if (ui.coachSending) return;
  const input = form.querySelector('input');
  const prompt = input.value.trim();
  if (!prompt) return;

  ui.coachSending = true;
  updateUserData(function (data) {
    return { coachMessages: data.coachMessages.concat([{ role: 'user', text: prompt }]) };
  });
  input.value = '';
  render();

  await sleep(450);
  const reply = coachReply(prompt);
  updateUserData(function (data) {
    return { coachMessages: data.coachMessages.concat([{ role: 'assistant', text: reply }]) };
  });
  ui.coachSending = false;
  render();
}

window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
